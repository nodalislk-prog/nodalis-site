<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODALIS — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="catalog.css">
</head>
<body>

<nav aria-label="Main">
  <div class="nav-links"><a href="index.html">Home</a><a href="petstore.html">Petstore</a></div>
  <a class="logotype" href="index.html">Nodalis</a>
  <div class="nav-links right"><a href="index.html#enquire">Enquire</a><a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener">Instagram</a></div>
</nav>

<main>
  <p class="crumb" id="crumb"><a href="index.html">Home</a></p>
  <div class="page-head">
    <span class="knot" aria-hidden="true"></span>
    <p class="eyebrow" id="cat-line">Handmade · Made to order</p>
    <h1 id="cat-title">Collection</h1>
  </div>
  <div class="cat-grid" id="grid"></div>
  <p class="empty-note" id="empty" hidden>New pieces for this collection are on the hook right now — see our latest on <a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener" style="border-bottom:1px solid var(--hairline)">Instagram</a>, or enquire about a custom piece.</p>
</main>

<footer>Handmade in Sri Lanka · <a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener">@nodalis.lk</a> · <a href="index.html">nodalis.lk</a></footer>

<script src="products.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get('c') || 'tops';
  const cat = CATEGORIES[slug] || CATEGORIES.tops;

  if (cat.group === 'pet') document.body.classList.add('pet');
  document.title = 'NODALIS — ' + cat.title;
  document.getElementById('cat-title').textContent = cat.title;
  document.getElementById('cat-line').textContent = cat.line;
  document.getElementById('crumb').innerHTML =
    '<a href="index.html">Home</a> &nbsp;/&nbsp; ' +
    (cat.group === 'pet' ? '<a href="petstore.html">Petstore</a> &nbsp;/&nbsp; ' : '') +
    cat.title;

  const items = PRODUCTS.filter(p => p.category === slug);
  const grid = document.getElementById('grid');

  if (!items.length) {
    document.getElementById('empty').hidden = false;
  }

  for (const p of items) {
    const a = document.createElement('a');
    a.className = 'piece';
    a.href = 'product.html?id=' + encodeURIComponent(p.id);
    a.innerHTML =
      '<figure>' +
        '<div class="frame"><div class="ph" data-label="' + p.id + '-front.jpg">' +
          '<img src="images/products/' + p.id + '-front.jpg" alt="" loading="lazy" onerror="this.remove()">' +
        '</div></div>' +
        '<figcaption>' +
          '<div class="name"></div>' +
          '<div class="meta"></div>' +
          '<div class="price"></div>' +
        '</figcaption>' +
      '</figure>';
    a.querySelector('.name').textContent = p.name;
    a.querySelector('.meta').textContent = p.short || 'Handmade · Made to order';
    a.querySelector('.price').textContent = p.price || '';
    grid.appendChild(a);
  }
</script>
</body>
</html>
