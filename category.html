<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODALIS — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="catalog.css">
</head>
<body>

<nav aria-label="Main">
  <div class="nav-links"><a href="index.html">Home</a><a href="petstore.html">Petstore</a></div>
  <a class="logotype" href="index.html">Nodalis</a>
  <div class="nav-links right"><a href="index.html#enquire">Enquire</a><a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener">Instagram</a></div>
</nav>

<main>
  <p class="crumb" id="crumb"><a href="index.html">Home</a></p>
  <div class="page-head">
    <span class="knot" aria-hidden="true"></span>
    <p class="eyebrow" id="cat-line">Handmade · Made to order</p>
    <h1 id="cat-title">Collection</h1>
  </div>
  <div class="cat-grid" id="grid"></div>
  <p class="empty-note" id="empty" hidden>New pieces for this collection are on the hook right now — see our latest on <a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener" style="border-bottom:1px solid var(--hairline)">Instagram</a>, or enquire about a custom piece.</p>
</main>

<footer>Handmade in Sri Lanka · <a href="https://instagram.com/nodalis.lk" target="_blank" rel="noopener">@nodalis.lk</a> · <a href="index.html">nodalis.lk</a></footer>

<script src="products.js"></script>
<script>
  /* ---- apply theme from SITE ---- */
  function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function applyTheme(pal){
    try{
      const t = (typeof SITE!=='undefined' && SITE.theme) ? SITE.theme : null; if(!t) return;
      const p = t[pal] || {}; const r = document.documentElement.style;
      if(p.bgTop) r.setProperty('--bg-top', p.bgTop);
      if(p.bgBottom) r.setProperty('--bg-bottom', p.bgBottom);
      if(p.ink) r.setProperty('--ink', p.ink);
      if(p.inkSoft) r.setProperty('--ink-soft', p.inkSoft);
      if(p.nav){ const c=hexRgb(p.nav); r.setProperty('--nav-bg','rgba('+c[0]+','+c[1]+','+c[2]+',.94)'); }
      if(t.gold){ r.setProperty('--yarn', t.gold); const g=hexRgb(t.gold); r.setProperty('--hairline','rgba('+g[0]+','+g[1]+','+g[2]+',.42)'); r.setProperty('--gold-bright', t.gold); }
    }catch(e){}
  }

  const params = new URLSearchParams(location.search);
  const slug = params.get('c') || 'tops';
  const cat = CATEGORIES[slug] || CATEGORIES.tops;
  const catId = CATEGORIES[slug] ? slug : 'tops';

  if (cat.group === 'pet') document.body.classList.add('pet');
  applyTheme(cat.group === 'pet' ? 'pet' : 'apparel');

  document.title = 'NODALIS \u2014 ' + cat.title;
  document.getElementById('cat-title').textContent = cat.title;
  document.getElementById('cat-line').textContent = cat.line;

  /* crumb: Home / Petstore / Parent / This */
  let crumb = '<a href="index.html">Home</a>';
  if (cat.group === 'pet') crumb += ' &nbsp;/&nbsp; <a href="petstore.html">Petstore</a>';
  if (cat.parent && CATEGORIES[cat.parent]) {
    crumb += ' &nbsp;/&nbsp; <a href="category.html?c=' + encodeURIComponent(cat.parent) + '">' + CATEGORIES[cat.parent].title + '</a>';
  }
  crumb += ' &nbsp;/&nbsp; ' + cat.title;
  document.getElementById('crumb').innerHTML = crumb;

  /* children of this category (sub-sections) */
  const children = Object.keys(CATEGORIES).filter(k => CATEGORIES[k].parent === catId);

  /* sub-section chips when viewing a parent */
  if (children.length) {
    const bar = document.createElement('div');
    bar.className = 'chips';
    bar.style.cssText = 'justify-content:center;margin:-20px 0 44px';
    const mk = (label, href, active) => {
      const a = document.createElement('a');
      a.href = href; a.textContent = label;
      a.style.cssText = 'border:1px solid ' + (active ? 'var(--ink)' : 'var(--hairline)') +
        ';padding:9px 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;' +
        (active ? 'background:var(--ink);color:var(--bg-top);' : '');
      return a;
    };
    bar.appendChild(mk('All', 'category.html?c=' + catId, true));
    children.forEach(k => bar.appendChild(mk(CATEGORIES[k].title, 'category.html?c=' + k, false)));
    document.querySelector('.page-head').after(bar);
  } else if (cat.parent && CATEGORIES[cat.parent]) {
    /* viewing a child: chips to siblings */
    const sibs = Object.keys(CATEGORIES).filter(k => CATEGORIES[k].parent === cat.parent);
    const bar = document.createElement('div');
    bar.className = 'chips';
    bar.style.cssText = 'justify-content:center;margin:-20px 0 44px';
    const mk = (label, href, active) => {
      const a = document.createElement('a');
      a.href = href; a.textContent = label;
      a.style.cssText = 'border:1px solid ' + (active ? 'var(--ink)' : 'var(--hairline)') +
        ';padding:9px 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;' +
        (active ? 'background:var(--ink);color:var(--bg-top);' : '');
      return a;
    };
    mkAll = mk('All', 'category.html?c=' + cat.parent, false);
    bar.appendChild(mkAll);
    sibs.forEach(k => bar.appendChild(mk(CATEGORIES[k].title, 'category.html?c=' + k, k === catId)));
    document.querySelector('.page-head').after(bar);
  }

  /* products: direct matches + (for parents) everything in child sections */
  const items = PRODUCTS.filter(p =>
    p.category === catId || (CATEGORIES[p.category] && CATEGORIES[p.category].parent === catId)
  );
  const grid = document.getElementById('grid');

  if (!items.length) {
    document.getElementById('empty').hidden = false;
  }

  for (const p of items) {
    const a = document.createElement('a');
    a.className = 'piece';
    a.href = 'product.html?id=' + encodeURIComponent(p.id);
    a.innerHTML =
      '<figure>' +
        '<div class="frame"><div class="ph" data-label="' + p.id + '-front.jpg">' +
          '<img src="images/products/' + p.id + '-front.jpg" alt="" loading="lazy" onerror="this.remove()">' +
        '</div></div>' +
        '<figcaption>' +
          '<div class="name"></div>' +
          '<div class="meta"></div>' +
          '<div class="price"></div>' +
        '</figcaption>' +
      '</figure>';
    a.querySelector('.name').textContent = p.name;
    a.querySelector('.meta').textContent = p.short || 'Handmade \u00b7 Made to order';
    a.querySelector('.price').textContent = p.price || '';
    grid.appendChild(a);
  }
</script>
</body>
</html>
